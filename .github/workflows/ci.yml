name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1
        with:
          release: "15.1"
          usesh: true
          prepare: |
            pkg install -y python313 libyaml php85 libxml2
            pkg add -A https://pkg.opnsense.org/FreeBSD:15:amd64/26.7/latest/Latest/py313-pyyaml.pkg
          run: |
            set -e
            PYTHON=/usr/local/bin/python3.13
            # Syntax checks for everything the Python tests cannot exercise.
            find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
            find src -name '*.xml' -print0 | xargs -0 xmllint --noout
            find src/etc/rc.d src/etc/rc.syshook.d pkg -type f -print0 | xargs -0 -n1 sh -n
            "${PYTHON}" -m py_compile tools/*.py tests/*.py src/opnsense/scripts/Adguardhome/*.py
            "${PYTHON}" tools/check_release.py
            "${PYTHON}" tests/settings.py
            "${PYTHON}" tests/dns_settings.py
            "${PYTHON}" tests/merge.py
            "${PYTHON}" tests/api_account.py
            "${PYTHON}" tests/agh_api.py
            "${PYTHON}" tests/syncd_receiver.py
            "${PYTHON}" tests/syncd_e2e.py
            "${PYTHON}" tests/build.py

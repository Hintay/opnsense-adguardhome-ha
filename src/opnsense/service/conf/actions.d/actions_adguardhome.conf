[start]
command:/usr/local/etc/rc.d/adguardhome start
parameters:
type:script
message:starting Adguardhome

[stop]
command:/usr/local/etc/rc.d/adguardhome stop
parameters:
type:script
message:stopping Adguardhome

[restart]
command:/usr/local/etc/rc.d/adguardhome restart
parameters:
type:script
message:restarting Adguardhome
description:Restart Adguardhome service

[status]
command:/usr/local/etc/rc.d/adguardhome status;exit 0
parameters:
type:script_output
message:request Adguardhome status

[dns_get]
command:/usr/local/opnsense/scripts/Adguardhome/dns_settings.py --get
parameters:
type:script_output
message:read AdGuard Home DNS settings

[dns_apply]
command:/usr/local/opnsense/scripts/Adguardhome/dns_settings.py --apply
parameters:
type:script_output
message:apply AdGuard Home DNS settings

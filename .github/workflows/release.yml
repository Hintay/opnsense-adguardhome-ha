name: Release plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.release.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check existing release
        id: release
        shell: bash
        run: |
          state="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${state}" == "false" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN || github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RUNTIME_REPOSITORY: ${{ vars.ADGUARDHOME_PACKAGE_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Download current runtime package
        shell: bash
        run: |
          test -n "${RUNTIME_REPOSITORY}"
          mkdir -p dependency
          gh release download --repo "${RUNTIME_REPOSITORY}" --pattern 'adguardhome-*.pkg' --dir dependency
          test "$(find dependency -maxdepth 1 -name 'adguardhome-*.pkg' | wc -l)" -eq 1
      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1
        with:
          release: "15.1"
          usesh: true
          envs: RELEASE_TAG
          prepare: |
            pkg install -y python313 libyaml php85 libxml2
            pkg add -A https://pkg.opnsense.org/FreeBSD:15:amd64/26.7/latest/Latest/py313-pyyaml.pkg
          run: |
            PYTHON=/usr/local/bin/python3.13
            "${PYTHON}" tools/check_release.py --tag "${RELEASE_TAG}"
            dependency_package="$(find dependency -maxdepth 1 -name 'adguardhome-*.pkg' -print -quit)"
            "${PYTHON}" tools/build.py \
              --adguardhome-package "${dependency_package}" \
              --opnsense-version 26.7 \
              --output dist-release
            "${PYTHON}" tests/settings.py
            "${PYTHON}" tests/dns_settings.py
            "${PYTHON}" tests/merge.py
            "${PYTHON}" tests/api_account.py
            "${PYTHON}" tests/agh_api.py
            "${PYTHON}" tests/syncd_receiver.py
            "${PYTHON}" tests/syncd_e2e.py
            "${PYTHON}" tests/build.py
            # Contract test: drive the exact AdGuard Home build we are about to publish
            # through the API hot-update mapping and require every mapped key to converge.
            mkdir -p runtime-root
            tar -xf "${dependency_package}" -C runtime-root
            ADGUARDHOME_BIN="$(find runtime-root -type f -name adguardhome -perm -u+x | head -1)"
            test -n "${ADGUARDHOME_BIN}"
            ADGUARDHOME_BIN="${ADGUARDHOME_BIN}" "${PYTHON}" tests/agh_contract.py
            cd dist-release
            set -- os-adguardhome-ha-*.pkg
            test "$#" -eq 1
            test -f "$1"
            FILE="$1"
            DGST="${FILE}.dgst"
            : > "${DGST}"
            for METHOD in md5 sha1 sha256 sha512
            do
              openssl dgst "-${METHOD}" "${FILE}" | sed 's/([^)]*)//g' >> "${DGST}"
            done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: os-adguardhome-ha
          path: |
            dist-release/os-adguardhome-ha-*.pkg
            dist-release/os-adguardhome-ha-*.pkg.dgst
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      published: ${{ steps.release.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: os-adguardhome-ha
          path: release
      - name: Publish GitHub release
        id: release
        shell: bash
        run: |
          state="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${state}" == "false" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${state}" == "true" ]]; then
            gh release upload "${RELEASE_TAG}" release/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${RELEASE_TAG}" release/* --draft --verify-tag --generate-notes --title "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}"
          fi
          gh release edit "${RELEASE_TAG}" --draft=false --repo "${GITHUB_REPOSITORY}"
          echo "published=true" >> "$GITHUB_OUTPUT"

  publish_repository:
    needs: release
    if: needs.release.outputs.published == 'true'
    # A caller must grant at least the permissions the reusable workflow declares.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-repository.yml
    secrets: inherit
